[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mps-qasm-predictor"
version = "0.1.0"
description = "QASM-only predictor of MPS hyperparameters"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "scipy>=1.10"
]

[tool.setuptools.packages.find]
where = ["src"]
